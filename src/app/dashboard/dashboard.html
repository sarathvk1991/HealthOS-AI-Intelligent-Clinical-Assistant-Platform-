<div class="dash-content">
  <div class="dash-container">
    <!-- Welcome Header Banner Component -->
    <app-welcome-banner
      [title]="bannerTitle"
      [subtitle]="bannerSubtitle"
      [actions]="bannerActions"
    ></app-welcome-banner>

    <!-- Metrics Bar -->
    <div class="dash-metrics">
      <app-metric-card
        *ngFor="let metric of metrics"
        [metric]="metric"
      ></app-metric-card>
    </div>

    <!-- Main Content Grid -->
    <div class="dash-grid">
      <!-- High Priority Patients Queue Component -->
      <app-patients-queue
        [title]="'High Priority Patients Queue'"
        [icon]="'error'"
        [patients]="patients"
      ></app-patients-queue>
      

      <!-- Today's Schedule Component -->
      <!-- <div class="dash-side-col">
        <app-schedule-list
          [title]="'Today\'s Schedule'"
          [icon]="'event'"
          [scheduleItems]="scheduleItems"
        ></app-schedule-list>
      </div> -->
    </div>
  </div>
</div>
