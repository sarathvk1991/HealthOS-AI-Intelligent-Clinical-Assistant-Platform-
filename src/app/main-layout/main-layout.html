<div class="app-body font-body-md">
  <header class="app-header">
    <div class="app-header__left">
      <button aria-label="Menu" class="app-icon-btn">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <a class="app-logo" routerLink="/dashboard">
        <span class="material-symbols-outlined app-logo__icon fill">
          health_and_safety
        </span>
        <span class="app-logo__text font-headline-md">
          HealthOS <span class="app-logo__text-sub">AI</span>
        </span>
      </a>

      <h1 class="app-header__title">
        {{ pageTitle() }}
      </h1>
    </div>

  <!-- Center Search Input for Patient & Reports screens -->
  <div class="app-header__search">
    <div class="app-header__search-inner">
      <span class="material-symbols-outlined app-header__search-icon">
        search
      </span>
      <input
        type="text"
        value=""
        placeholder="Search patients by name, ID, or condition..."
        class="app-header__search-input"
      />
    </div>
  </div>

    <!-- Right Top Nav & Action Buttons -->
    <div class="app-header__right">
      <!-- Top Nav Links for Desktop -->
      <nav class="app-header__nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="app-header__nav-link--active"
        class="app-header__nav-link"
      >
        Dashboard
      </a>
      <a
        routerLink="/patients"
        routerLinkActive="app-header__nav-link--active"
        class="app-header__nav-link"
      >
        Patients
      </a>
      <a
        routerLink="/consultations"
        routerLinkActive="app-header__nav-link--active"
        class="app-header__nav-link"
      >
        Consultations
      </a>
      <a
        routerLink="/reports"
        routerLinkActive="app-header__nav-link--active"
        class="app-header__nav-link"
      >
        Reports
      </a>
      </nav>

      <!-- Notifications Icon (closed by default) -->
      <div class="app-header__notif">
        <button
          class="app-icon-btn"
          aria-label="Notifications"
        >
          <span class="material-symbols-outlined">notifications</span>
          <span class="app-header__notif-dot"></span>
        </button>
      </div>

      <!-- View Full AI Summary Action Button -->
      <button type="button" class="app-btn-ai">
        <span class="material-symbols-outlined fill">
          auto_awesome
        </span>
        <span class="app-hide-mobile">View Full AI Summary</span>
        <span class="app-show-mobile">AI</span>
      </button>

      <!-- New Patient Button -->
      <button type="button" class="app-btn-primary">
        <span class="material-symbols-outlined">add</span>
        <span class="app-hide-mobile">New Patient</span>
      </button>
    </div>
  </header>

  <div class="app-body-layout">
    <app-sidebar class="app-left-side-bar"></app-sidebar>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <nav class="app-mobile-nav">
    <!-- Home / Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="app-mobile-nav__link--active"
      class="app-mobile-nav__link"
    >
      <span class="material-symbols-outlined app-mobile-nav__icon">
        home
      </span>
      <span class="app-mobile-nav__label font-label-sm">Home</span>
    </a>

    <!-- Patients -->
    <a
      routerLink="/patients"
      routerLinkActive="app-mobile-nav__link--active"
      class="app-mobile-nav__link"
    >
      <span class="material-symbols-outlined app-mobile-nav__icon">
        person_search
      </span>
      <span class="app-mobile-nav__label font-label-sm">Patients</span>
    </a>

    <!-- Add / Consultations -->
    <a
      routerLink="/consultations"
      routerLinkActive="app-mobile-nav__fab--active"
      class="app-mobile-nav__fab"
      aria-label="Add Consultation"
    >
      <span class="material-symbols-outlined app-mobile-nav__fab-icon fill">
        add_circle
      </span>
      <span class="app-sr-only">Add Consultation</span>
    </a>

    <!-- Reports -->
    <a
      routerLink="/reports"
      routerLinkActive="app-mobile-nav__link--active"
      class="app-mobile-nav__link"
    >
      <span class="material-symbols-outlined app-mobile-nav__icon">
        analytics
      </span>
      <span class="app-mobile-nav__label font-label-sm">Reports</span>
    </a>
  </nav>
</div>
